<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AudioHub | Premium Player</title>
    <!-- Importar fuente profesional desde Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #0f172a; /* Fondo oscuro moderno */
            --bg-card: #1e293b;
            --bg-card-hover: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981; /* Verde esmeralda tipo Spotify */
            --sidebar-width: 450px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem;
        }

        /* Cabecera */
        header {
            max-width: 1200px;
            margin: 0 auto 3rem auto;
            border-bottom: 1px solid #334155;
            padding-bottom: 1.5rem;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        header p {
            color: var(--text-muted);
            margin-top: 0.5rem;
            font-size: 1.1rem;
        }

        /* Grid de Tarjetas */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 24px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Diseño de la Tarjeta */
        .card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 16px;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.3s ease;
            position: relative;
        }

        .card:hover {
            background: var(--bg-card-hover);
            transform: translateY(-5px);
        }

        /* Contenedor de la Imagen */
        .card-image-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        .card-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover .card-image-wrapper img {
            transform: scale(1.08); /* Efecto zoom suave */
        }

        /* Botón de Play Flotante */
        .play-btn {
            position: absolute;
            bottom: 12px;
            right: 12px;
            width: 48px;
            height: 48px;
            background-color: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 16px rgba(16, 185, 129, 0.4);
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
        }

        .card:hover .play-btn {
            opacity: 1;
            transform: translateY(0);
        }

        .play-btn svg {
            width: 20px;
            height: 20px;
            fill: #000;
            margin-left: 4px; /* Centrado visual del play */
        }

        /* Textos de la tarjeta */
        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2; /* Limitar a 2 líneas */
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* --- Panel Lateral (Sidebar) --- */
        .sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: var(--sidebar-width);
            max-width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px); /* Efecto cristal (Glassmorphism) */
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255,255,255,0.1);
            transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        .sidebar.active {
            right: 0;
        }

        .sidebar-header {
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar-header h3 {
            font-size: 1.2rem;
            font-weight: 500;
        }

        .close-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .close-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        #playerFrame {
            width: 100%;
            flex-grow: 1;
            border: none;
            background: transparent;
        }

        /* Capa de fondo oscura (Overlay) */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(3px);
            opacity: 0;
            visibility: hidden;
            transition: 0.4s ease;
            z-index: 999;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* Diseño Responsivo */
        @media (max-width: 600px) {
            body { padding: 1rem; }
            .card-grid { grid-template-columns: repeat(2, 1fr); gap: 16px; }
            .card { padding: 12px; }
            .play-btn { width: 36px; height: 36px; bottom: 8px; right: 8px; }
            .play-btn svg { width: 14px; height: 14px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>AudioHub</h1>
        <p>Tu colección personal de sonidos y música.</p>
    </header>

    <!-- Aquí se inyectarán las tarjetas desde JavaScript -->
    <main class="card-grid" id="contenedorTarjetas">
        <!-- Cargando... -->
    </main>

    <!-- Overlay y Panel Lateral -->
    <div class="overlay" id="overlay"></div>
    
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3>Reproduciendo ahora</h3>
            <button class="close-btn" id="closeBtn" title="Cerrar panel">&times;</button>
        </div>
        <!-- Iframe sin fondo para fusionarse con el sidebar -->
        <iframe id="playerFrame" src="" allow="autoplay" allowtransparency="true"></iframe>
    </aside>

    <script>
        const contenedorTarjetas = document.getElementById('contenedorTarjetas');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const closeBtn = document.getElementById('closeBtn');
        const playerFrame = document.getElementById('playerFrame');

        // SVG del icono de Play para inyectarlo en las tarjetas
        const playIconSVG = `
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M8 5.14v14l11-7-11-7z"></path>
            </svg>
        `;

        // Función para cargar los datos JSON
        async function cargarAudios() {
            try {
                // En GitHub Pages, asegúrate de que datos.json esté en la misma carpeta
                const respuesta = await fetch('datos.json');
                const datos = await respuesta.json();
                
                // Limpiar el contenedor antes de agregar
                contenedorTarjetas.innerHTML = '';

                datos.forEach(item => {
                    // Si no hay imagen, pone una por defecto
                    const imagenSrc = item.imagen ? item.imagen : 'https://via.placeholder.com/400x400/2a2a2a/ffffff?text=Audio';

                    const tarjeta = document.createElement('article');
                    tarjeta.className = 'card';
                    
                    tarjeta.innerHTML = `
                        <div class="card-image-wrapper">
                            <img src="${imagenSrc}" alt="Portada de ${item.titulo}" loading="lazy">
                            <div class="play-btn">
                                ${playIconSVG}
                            </div>
                        </div>
                        <div class="card-content">
                            <h2 class="card-title">${item.titulo}</h2>
                            <p class="card-desc">${item.descripcion}</p>
                        </div>
                    `;

                    // Al hacer clic, abre el reproductor
                    tarjeta.addEventListener('click', () => openPlayer(item.url));
                    contenedorTarjetas.appendChild(tarjeta);
                });
            } catch (error) {
                console.error('Error cargando los datos:', error);
                contenedorTarjetas.innerHTML = '<p style="color: #ef4444;">No se pudieron cargar los audios. Verifica que datos.json exista.</p>';
            }
        }

        // Funciones del reproductor y Sidebar
        function openPlayer(url) {
            playerFrame.src = url;
            sidebar.classList.add('active');
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden'; // Evita que la página del fondo haga scroll
        }

        function closePlayer() {
            sidebar.classList.remove('active');
            overlay.classList.remove('active');
            document.body.style.overflow = 'auto'; // Restaura el scroll
            
            // Espera a que termine la animación css (400ms) para cortar el audio
            setTimeout(() => { 
                playerFrame.src = ''; 
            }, 400);
        }

        // Eventos para cerrar
        closeBtn.addEventListener('click', closePlayer);
        overlay.addEventListener('click', closePlayer);

        // Iniciar la carga al abrir la página
        cargarAudios();
    </script>
</body>
</html>
