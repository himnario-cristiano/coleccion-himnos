<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coleccion | HIMNOS</title>
    
    <!-- Enlace al Manifest para la PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --bg-card-hover: #2dd4bf15;
            --border-card: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
            --accent-hover: #059669;
            --sidebar-min-width: 320px;
            --sidebar-default-width: 450px;
            --sidebar-max-width: 60vw;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            background-image: radial-gradient(circle at top right, #1e293b, transparent 40%),
                              radial-gradient(circle at bottom left, #0f172a, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem;
            -webkit-tap-highlight-color: transparent;
        }

        /* Cabecera con Botón de Instalación */
        header {
            max-width: 1400px;
            margin: 0 auto 3rem auto;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header-text h1 {
            font-size: 2.75rem;
            font-weight: 700;
            letter-spacing: -1px;
            background: linear-gradient(90deg, #f8fafc, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-text p {
            color: var(--text-muted);
            margin-top: 0.5rem;
            font-size: 1.1rem;
            font-weight: 300;
        }

        /* Botón Instalar PWA */
        .install-btn {
            background-color: var(--accent);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: none;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .install-btn:hover {
            transform: translateY(-2px);
            background-color: var(--accent-hover);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }

        .install-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Grid de Tarjetas */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 28px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 20px;
            padding: 18px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .card:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent);
            transform: translateY(-6px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        /* Contenedor de la Imagen a 4:3 */
        .card-image-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 18px;
            background: #0f172a;
        }

        .card-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card:hover .card-image-wrapper img {
            transform: scale(1.08);
        }

        /* Botón de Play Flotante */
        .play-btn {
            position: absolute;
            bottom: 14px;
            right: 14px;
            width: 52px;
            height: 52px;
            background-color: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.5);
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card:hover .play-btn {
            opacity: 1;
            transform: translateY(0);
        }

        .play-btn svg {
            width: 22px;
            height: 22px;
            fill: #fff;
            margin-left: 4px;
        }

        .card-content {
            padding: 0 4px;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Panel Lateral */
        .sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: var(--sidebar-default-width);
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            transition: right 0.4s cubic-bezier(0.25, 1, 0.5, 1); /* Ancho es modificado por JS sin transición para no laggear */
            z-index: 1000;
            display: flex;
            flex-direction: column;
            box-shadow: -10px 0 30px rgba(0,0,0,0.5);
        }

        .sidebar.active {
            right: 0;
        }

        /* Resizer para Escritorio */
        .resizer {
            position: absolute;
            top: 0;
            bottom: 0;
            left: -4px;
            width: 8px;
            cursor: ew-resize;
            background-color: transparent;
            z-index: 1001;
            transition: background-color 0.2s;
        }
        
        .resizer:hover, .resizer.active-resize {
            background-color: var(--accent);
        }

        .sidebar-header {
            padding: 10px 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar-header h3 {
            font-size: 1.25rem;
            font-weight: 500;
            color: #fff;
        }

        .close-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .close-btn:hover {
            background: #ef4444;
            border-color: #ef4444;
            transform: rotate(90deg);
        }

        #playerFrame {
            width: 100%;
            flex-grow: 1;
            border: none;
            background: transparent;
        }
 
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
            z-index: 999;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* --- Diseño Responsivo (Móviles y Tablets) --- */
        @media (max-width: 768px) {
            body { padding: 1.5rem 1rem; }
            .header-text h1 { font-size: 2.2rem; }
            .card-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
            .card { padding: 12px; border-radius: 16px; }
            
            /* Botón visible siempre en táctil ya que no hay hover */
            .play-btn { opacity: 1; width: 44px; height: 44px; bottom: 10px; right: 10px; transform: none; }
            .play-btn svg { width: 18px; height: 18px; }
            
            /* Sidebar a pantalla completa en móviles */
            .sidebar { 
                width: 100% !important; /* Importante para sobreescribir el estilo en línea del JS de resize */
                height: 100%;
                border-left: none;
            }
            .sidebar-header { padding: 10px 5px; }
            
            /* Ocultar resizer en móviles porque ocupará todo el ancho */
            .resizer { display: none; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-text">
            <h1>HIMNOS COLECCIÓN</h1>
            <p>Tu colección personal de Himnos, Cantos y Alabanzas.</p>
        </div>
        
        <!-- Botón de Instalación PWA -->
        <button id="installBtn" class="install-btn">
            <svg viewBox="0 0 24 24">
                <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
            </svg>
            Instalar App
        </button>
    </header>

    <main class="card-grid" id="contenedorTarjetas"></main>

    <div class="overlay" id="overlay"></div>
    
    <aside class="sidebar" id="sidebar">
        <!-- Div para arrastrar y cambiar tamaño -->
        <div class="resizer" id="resizer"></div>
        
        <div class="sidebar-header">
            <h3>Reproductor</h3>
            <button class="close-btn" id="closeBtn" title="Cerrar panel">&times;</button>
        </div>
        <iframe id="playerFrame" src="" allow="autoplay" allowtransparency="true"></iframe>
    </aside>

    <script>
        // --- 1. Lógica de la Interfaz y Datos ---
        const contenedorTarjetas = document.getElementById('contenedorTarjetas');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const closeBtn = document.getElementById('closeBtn');
        const playerFrame = document.getElementById('playerFrame');
        const resizer = document.getElementById('resizer');

        const playIconSVG = `
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M8 5.14v14l11-7-11-7z"></path>
            </svg>
        `;

        // Función para cargar desde el archivo JSON
        async function cargarAudios() {
            try {
                const respuesta = await fetch('datos.json');
                const datos = await respuesta.json();
                
                contenedorTarjetas.innerHTML = '';

                datos.forEach(item => {
                    const imagenSrc = item.imagen ? item.imagen : 'https://via.placeholder.com/800x600/1e293b/94a3b8?text=Audio';

                    const tarjeta = document.createElement('article');
                    tarjeta.className = 'card';
                    
                    tarjeta.innerHTML = `
                        <div class="card-image-wrapper">
                            <img src="${imagenSrc}" alt="Portada" loading="lazy">
                            <div class="play-btn">
                                ${playIconSVG}
                            </div>
                        </div>
                        <div class="card-content">
                            <h2 class="card-title">${item.titulo}</h2>
                            <p class="card-desc">${item.descripcion}</p>
                        </div>
                    `;

                    tarjeta.addEventListener('click', () => openPlayer(item.url));
                    contenedorTarjetas.appendChild(tarjeta);
                });
            } catch (error) {
                console.error('Error cargando los datos:', error);
                contenedorTarjetas.innerHTML = '<p style="color: #ef4444; grid-column: 1 / -1;">No se pudieron cargar los himnos. Verifica que datos.json exista en tu repositorio.</p>';
            }
        }

        function openPlayer(url) {
            playerFrame.src = url;
            sidebar.classList.add('active');
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden'; 
        }

        function closePlayer() {
            sidebar.classList.remove('active');
            overlay.classList.remove('active');
            document.body.style.overflow = 'auto'; 
            setTimeout(() => { playerFrame.src = ''; }, 400);
        }

        closeBtn.addEventListener('click', closePlayer);
        overlay.addEventListener('click', closePlayer);
        
        // Iniciar la carga
        cargarAudios();

        // --- 2. Lógica para Redimensionar Panel Lateral (Escritorio) ---
        let isResizing = false;

        resizer.addEventListener('mousedown', (e) => {
            isResizing = true;
            document.body.style.cursor = 'ew-resize';
            resizer.classList.add('active-resize');
            // Evitar que el iframe "robe" los eventos del mouse al arrastrar rápido
            playerFrame.style.pointerEvents = 'none';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            // Calculamos el nuevo ancho en base a la posición del mouse desde la derecha
            let newWidth = window.innerWidth - e.clientX;
            
            // Restricciones: Mínimo 320px, Máximo 60% del ancho de la pantalla
            const minWidth = 320;
            const maxWidth = window.innerWidth * 0.6;
            
            if (newWidth < minWidth) newWidth = minWidth;
            if (newWidth > maxWidth) newWidth = maxWidth;
            
            sidebar.style.width = `${newWidth}px`;
        });

        document.addEventListener('mouseup', () => {
            if (isResizing) {
                isResizing = false;
                document.body.style.cursor = 'default';
                resizer.classList.remove('active-resize');
                // Devolverle los eventos al iframe
                playerFrame.style.pointerEvents = 'auto';
            }
        });

        // --- 3. Lógica de PWA (Instalación y Service Worker) ---
        let promptDiferido;
        const botonInstalar = document.getElementById('installBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            promptDiferido = e;
            botonInstalar.style.display = 'flex';
        });

        botonInstalar.addEventListener('click', async () => {
            if (promptDiferido !== null) {
                promptDiferido.prompt();
                const { outcome } = await promptDiferido.userChoice;
                if (outcome === 'accepted') {
                    console.log('El usuario aceptó la instalación');
                } else {
                    console.log('El usuario rechazó la instalación');
                }
                promptDiferido = null;
                botonInstalar.style.display = 'none';
            }
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(registro => {
                    console.log('ServiceWorker registrado con éxito: ', registro.scope);
                }).catch(err => {
                    console.log('Error al registrar ServiceWorker: ', err);
                });
            });
        }
    </script>
</body>
</html>
