<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coleccion | HIMNOS</title>
    
    <!-- Enlace al Manifest para la PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --bg-card-hover: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
            --sidebar-width: 450px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem;
            -webkit-tap-highlight-color: transparent; /* Quita el resplandor azul al tocar en móviles */
        }

        /* Cabecera con Botón de Instalación */
        header {
            max-width: 1200px;
            margin: 0 auto 3rem auto;
            border-bottom: 1px solid #334155;
            padding-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-text h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header-text p {
            color: var(--text-muted);
            margin-top: 0.5rem;
            font-size: 1.1rem;
        }

        /* Botón Instalar PWA */
        .install-btn {
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: none; /* Oculto por defecto hasta que el navegador lo permita */
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            transition: transform 0.2s, background 0.2s;
        }

        .install-btn:hover {
            transform: scale(1.05);
            background-color: #0ea5e9;
        }

        .install-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* Grid de Tarjetas */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 24px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 16px;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.3s ease;
            position: relative;
        }

        .card:hover {
            background: var(--bg-card-hover);
            transform: translateY(-5px);
        }

        /* Contenedor de la Imagen a 4:3 */
        .card-image-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3; /* Relación de aspecto 4:3 */
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            background: #000; /* Fondo negro por si la imagen tarda en cargar */
        }

        .card-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover .card-image-wrapper img {
            transform: scale(1.08);
        }

        /* Botón de Play Flotante */
        .play-btn {
            position: absolute;
            bottom: 12px;
            right: 12px;
            width: 48px;
            height: 48px;
            background-color: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 16px rgba(16, 185, 129, 0.4);
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
        }

        .card:hover .play-btn {
            opacity: 1;
            transform: translateY(0);
        }

        .play-btn svg {
            width: 20px;
            height: 20px;
            fill: #000;
            margin-left: 4px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Panel Lateral */
        .sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: var(--sidebar-width);
            max-width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255,255,255,0.1);
            transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        .sidebar.active {
            right: 0;
        }

        .sidebar-header {
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar-header h3 {
            font-size: 1.2rem;
            font-weight: 500;
        }

        .close-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .close-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        #playerFrame {
            width: 100%;
            flex-grow: 1;
            border: none;
            background: transparent;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(3px);
            opacity: 0;
            visibility: hidden;
            transition: 0.4s ease;
            z-index: 999;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* --- Diseño Responsivo (Móviles) --- */
        @media (max-width: 600px) {
            body { padding: 1rem; }
            .header-text h1 { font-size: 2rem; }
            .card-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
            .card { padding: 10px; }
            
            /* Botón visible siempre en táctil ya que no hay hover */
            .play-btn { opacity: 0.9; width: 36px; height: 36px; bottom: 8px; right: 8px; }
            .play-btn svg { width: 14px; height: 14px; }
            
            /* Sidebar a pantalla completa en móviles */
            .sidebar { 
                width: 100%; 
                border-left: none; /* Quitamos el borde porque cubre todo */
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-text">
            <h1>HIMNOS COLECCION</h1>
            <p>Tu colección personal de Himnos Cantos y Alabanzas.</p>
        </div>
        
        <!-- Botón de Instalación PWA -->
        <button id="installBtn" class="install-btn">
            <svg viewBox="0 0 24 24">
                <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
            </svg>
            Instalar App
        </button>
    </header>

    <main class="card-grid" id="contenedorTarjetas"></main>

    <div class="overlay" id="overlay"></div>
    
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3>Reproductor</h3>
            <button class="close-btn" id="closeBtn" title="Cerrar panel">&times;</button>
        </div>
        <iframe id="playerFrame" src="" allow="autoplay" allowtransparency="true"></iframe>
    </aside>

    <script>
        // --- 1. Lógica de la Interfaz y Datos ---
        const contenedorTarjetas = document.getElementById('contenedorTarjetas');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const closeBtn = document.getElementById('closeBtn');
        const playerFrame = document.getElementById('playerFrame');

        const playIconSVG = `
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M8 5.14v14l11-7-11-7z"></path>
            </svg>
        `;

        async function cargarAudios() {
            try {
                const respuesta = await fetch('datos.json');
                const datos = await respuesta.json();
                
                contenedorTarjetas.innerHTML = '';

                datos.forEach(item => {
                    const imagenSrc = item.imagen ? item.imagen : 'https://via.placeholder.com/800x600/2a2a2a/ffffff?text=Audio';

                    const tarjeta = document.createElement('article');
                    tarjeta.className = 'card';
                    
                    tarjeta.innerHTML = `
                        <div class="card-image-wrapper">
                            <img src="${imagenSrc}" alt="Portada" loading="lazy">
                            <div class="play-btn">
                                ${playIconSVG}
                            </div>
                        </div>
                        <div class="card-content">
                            <h2 class="card-title">${item.titulo}</h2>
                            <p class="card-desc">${item.descripcion}</p>
                        </div>
                    `;

                    tarjeta.addEventListener('click', () => openPlayer(item.url));
                    contenedorTarjetas.appendChild(tarjeta);
                });
            } catch (error) {
                console.error('Error cargando los datos:', error);
            }
        }

        function openPlayer(url) {
            playerFrame.src = url;
            sidebar.classList.add('active');
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden'; 
        }

        function closePlayer() {
            sidebar.classList.remove('active');
            overlay.classList.remove('active');
            document.body.style.overflow = 'auto'; 
            setTimeout(() => { playerFrame.src = ''; }, 400);
        }

        closeBtn.addEventListener('click', closePlayer);
        overlay.addEventListener('click', closePlayer);
        cargarAudios();

        // --- 2. Lógica de PWA (Instalación y Service Worker) ---
        let promptDiferido;
        const botonInstalar = document.getElementById('installBtn');

        // Capturar el evento que permite la instalación
        window.addEventListener('beforeinstallprompt', (e) => {
            // Prevenir que el navegador muestre el aviso por defecto
            e.preventDefault();
            // Guardar el evento para usarlo luego
            promptDiferido = e;
            // Mostrar nuestro botón de instalación personalizado
            botonInstalar.style.display = 'flex';
        });

        // Acción al hacer clic en instalar
        botonInstalar.addEventListener('click', async () => {
            if (promptDiferido !== null) {
                // Mostrar el prompt nativo del sistema
                promptDiferido.prompt();
                const { outcome } = await promptDiferido.userChoice;
                if (outcome === 'accepted') {
                    console.log('El usuario aceptó la instalación');
                } else {
                    console.log('El usuario rechazó la instalación');
                }
                // Limpiar la variable
                promptDiferido = null;
                // Ocultar el botón ya que se usó
                botonInstalar.style.display = 'none';
            }
        });

        // Registrar el Service Worker para habilitar funcionalidades PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(registro => {
                    console.log('ServiceWorker registrado con éxito: ', registro.scope);
                }).catch(err => {
                    console.log('Error al registrar ServiceWorker: ', err);
                });
            });
        }
    </script>
</body>
</html>
