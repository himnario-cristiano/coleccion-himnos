<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Himnodix</title>
    
    <link rel="icon" href="coleccion-himnos.png" type="image/png">
    <!-- Enlace al Manifest para la PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --bg-card-hover: #2dd4bf15;
            --border-card: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
            --accent-hover: #059669;
            --sidebar-min-width: 320px;
            --sidebar-default-width: 450px;
            --sidebar-max-width: 60vw;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            background-image: radial-gradient(circle at top right, #1e293b, transparent 40%),
                              radial-gradient(circle at bottom left, #0f172a, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem;
            -webkit-tap-highlight-color: transparent;
        }

        /* Cabecera con Controles */
        header {
            max-width: 1400px;
            margin: 0 auto 1.5rem auto; /* <-- Cambiamos 3rem por 1.5rem aquí */
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header-text h1 {
            font-size: 2.75rem;
            font-weight: 700;
            letter-spacing: -1px;
            background: linear-gradient(90deg, #f8fafc, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-text p {
            color: var(--text-muted);
            margin-top: 0.5rem;
            font-size: 1.1rem;
            font-weight: 300;
        }
        
        /* Contenedor de Botones y Filtros */
        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* Estilos del Select (Filtro) */
        .custom-select {
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-card);
            padding: 10px 16px;
            border-radius: 50px;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
            padding-right: 40px;
        }

        .custom-select:focus, .custom-select:hover {
            border-color: var(--accent);
        }

        /* Botón de Limpiar Datos / Recargar */
        .icon-btn {
            background-color: var(--bg-card);
            color: var(--text-muted);
            border: 1px solid var(--border-card);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .icon-btn:hover {
            color: var(--accent);
            border-color: var(--accent);
            background-color: var(--bg-card-hover);
            transform: rotate(90deg);
        }

        .icon-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Botón Instalar PWA */
        .install-btn {
            background-color: var(--accent);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: none;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .install-btn:hover {
            transform: translateY(-2px);
            background-color: var(--accent-hover);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }

        .install-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Grid de Tarjetas */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 28px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 20px;
            padding: 18px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .card:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent);
            transform: translateY(-6px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        /* Contenedor de la Imagen a 4:3 */
        .card-image-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 18px;
            background: #0f172a;
        }

        .card-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card:hover .card-image-wrapper img {
            transform: scale(1.08);
        }

        /* Botón de Play Flotante */
        .play-btn {
            position: absolute;
            bottom: 14px;
            right: 14px;
            width: 52px;
            height: 52px;
            background-color: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.5);
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card:hover .play-btn {
            opacity: 1;
            transform: translateY(0);
        }

        .play-btn svg {
            width: 22px;
            height: 22px;
            fill: #fff;
            margin-left: 4px;
        }

        .card-content {
            padding: 0 4px;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Panel Lateral */
        .sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: var(--sidebar-default-width);
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            transition: right 0.4s cubic-bezier(0.25, 1, 0.5, 1); 
            z-index: 1000;
            display: flex;
            flex-direction: column;
            box-shadow: -10px 0 30px rgba(0,0,0,0.5);
        }

        .sidebar.active {
            right: 0;
        }

        /* Resizer para Escritorio */
        .resizer {
            position: absolute;
            top: 0;
            bottom: 0;
            left: -4px;
            width: 8px;
            cursor: ew-resize;
            background-color: transparent;
            z-index: 1001;
            transition: background-color 0.2s;
        }
        
        .resizer:hover, .resizer.active-resize {
            background-color: var(--accent);
        }

        .sidebar-header {
            padding: 10px 15px;
            display: flex;
            justify-content: center; /* Centra el título de forma estricta */
            align-items: center;
            position: relative; /* Permite que el botón sea absoluto respecto a este contenedor */
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar-header h3 {
            font-size: 1.25rem;
            font-weight: 500;
            color: #fff;
            margin: 0;
        }

        .close-btn {
            position: absolute;
            left: 10px; /* Fija el botón al lado izquierdo */
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .close-btn:hover {
            background: #ef4444;
            border-color: #ef4444;
            transform: translateX(4px); /* Desliza la flecha sutilmente en lugar de rotarla */
        }

        #playerFrame {
            width: 100%;
            flex-grow: 1;
            border: none;
            background: transparent;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
            z-index: 999;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* --- Diseño Responsivo (Móviles y Tablets) --- */
        @media (max-width: 768px) {
            body { padding: 1.5rem 1rem; }
            .header-text h1 { font-size: 2.2rem; }
            .card-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
            .card { padding: 12px; border-radius: 16px; }
            
            .play-btn { opacity: 1; width: 44px; height: 44px; bottom: 10px; right: 10px; transform: none; }
            .play-btn svg { width: 18px; height: 18px; }
            
            .sidebar { 
                width: 100% !important; 
                height: 100%;
                border-left: none;
            }
            .sidebar-header { padding: 10px 5px; }
            .resizer { display: none; }
            
            .header-actions { width: 100%; justify-content: space-between; }
            .custom-select { flex-grow: 1; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-text">
            <h1>Himnodix</h1>
            <p>Tu colección de Himnarios con Himnos, Cantos y Alabanzas.</p>
        </div>
        
        <div class="header-actions">
            <!-- Filtro Select por Título -->
            <select id="filtroSelect" class="custom-select">
                <option value="todos">Todos los Himnarios</option>
                <!-- Las opciones se generarán por JS basadas en el 'titulo' -->
            </select>

            <!-- Botón Limpiar Cache / Recargar -->
            <button id="clearDataBtn" class="icon-btn" title="Limpiar caché y recargar la página">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M17.65 6.35A7.95 7.95 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                </svg>
            </button>

            <!-- Botón de Instalación PWA -->
            <button id="installBtn" class="install-btn">
                <svg viewBox="0 0 24 24">
                    <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
                </svg>
                Instalar App
            </button>
        </div>
    </header>

    <main class="card-grid" id="contenedorTarjetas"></main>

    <div class="overlay" id="overlay"></div>
    
    <aside class="sidebar" id="sidebar">
        <div class="resizer" id="resizer"></div>
        
        <div class="sidebar-header">
            <!-- Flecha apuntando a la derecha indicando por dónde se cierra -->
            <button class="close-btn" id="closeBtn" title="Cerrar panel">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
            <h3>Reproductor</h3>
        </div>
        <iframe id="playerFrame" src="" allow="autoplay" allowtransparency="true"></iframe>
    </aside>

    <script>
        // --- 1. Lógica de la Interfaz y Datos ---
        const contenedorTarjetas = document.getElementById('contenedorTarjetas');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const closeBtn = document.getElementById('closeBtn');
        const playerFrame = document.getElementById('playerFrame');
        const resizer = document.getElementById('resizer');
        const filtroSelect = document.getElementById('filtroSelect');
        const clearDataBtn = document.getElementById('clearDataBtn');

        let todosLosAudios = []; 

        const playIconSVG = `
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M8 5.14v14l11-7-11-7z"></path>
            </svg>
        `;

        async function cargarAudios() {
            try {
                const respuesta = await fetch('datos.json');
                todosLosAudios = await respuesta.json();
                
                // Extraer los TÍTULOS únicos del JSON y poblar el select
                const titulos = [...new Set(todosLosAudios.map(item => item.titulo).filter(Boolean))];
                titulos.forEach(titulo => {
                    const option = document.createElement('option');
                    option.value = titulo;
                    option.textContent = titulo;
                    filtroSelect.appendChild(option);
                });

                renderizarTarjetas(todosLosAudios);
            } catch (error) {
                console.error('Error cargando los datos:', error);
                contenedorTarjetas.innerHTML = '<p style="color: #ef4444; grid-column: 1 / -1;">No se pudieron cargar los himnos. Verifica que datos.json exista en tu repositorio.</p>';
            }
        }

        function renderizarTarjetas(datos) {
            contenedorTarjetas.innerHTML = '';
            
            if (datos.length === 0) {
                contenedorTarjetas.innerHTML = '<p style="color: var(--text-muted); grid-column: 1 / -1;">No se encontraron resultados.</p>';
                return;
            }

            datos.forEach(item => {
                const imagenSrc = item.imagen ? item.imagen : 'https://via.placeholder.com/800x600/1e293b/94a3b8?text=Audio';

                const tarjeta = document.createElement('article');
                tarjeta.className = 'card';
                
                tarjeta.innerHTML = `
                    <div class="card-image-wrapper">
                        <img src="${imagenSrc}" alt="Portada" loading="lazy">
                        <div class="play-btn">
                            ${playIconSVG}
                        </div>
                    </div>
                    <div class="card-content">
                        <h2 class="card-title">${item.titulo}</h2>
                        <p class="card-desc">${item.descripcion}</p>
                    </div>
                `;

                tarjeta.addEventListener('click', () => openPlayer(item.url));
                contenedorTarjetas.appendChild(tarjeta);
            });
        }

        // Evento para filtrar usando el TITULO
        filtroSelect.addEventListener('change', (e) => {
            const tituloSeleccionado = e.target.value;
            
            if (tituloSeleccionado === 'todos') {
                renderizarTarjetas(todosLosAudios);
            } else {
                const filtrados = todosLosAudios.filter(item => item.titulo === tituloSeleccionado);
                renderizarTarjetas(filtrados);
            }
        });

        // Evento para limpiar cookies y recargar
        clearDataBtn.addEventListener('click', () => {
            document.cookie.split(";").forEach((c) => {
                document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/");
            });

            if ('caches' in window) {
                caches.keys().then((nombres) => {
                    nombres.forEach(nombre => caches.delete(nombre));
                });
            }

            localStorage.clear();
            sessionStorage.clear();
            window.location.reload(true);
        });

        function openPlayer(url) {
            playerFrame.src = url;
            sidebar.classList.add('active');
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden'; 
        }

        function closePlayer() {
            sidebar.classList.remove('active');
            overlay.classList.remove('active');
            document.body.style.overflow = 'auto'; 
            setTimeout(() => { playerFrame.src = ''; }, 400);
        }

        closeBtn.addEventListener('click', closePlayer);
        overlay.addEventListener('click', closePlayer);
        
        cargarAudios();

        // --- 2. Lógica para Redimensionar Panel Lateral (Escritorio) ---
        let isResizing = false;

        resizer.addEventListener('mousedown', (e) => {
            isResizing = true;
            document.body.style.cursor = 'ew-resize';
            resizer.classList.add('active-resize');
            playerFrame.style.pointerEvents = 'none';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            let newWidth = window.innerWidth - e.clientX;
            
            const minWidth = 320;
            const maxWidth = window.innerWidth * 0.6;
            
            if (newWidth < minWidth) newWidth = minWidth;
            if (newWidth > maxWidth) newWidth = maxWidth;
            
            sidebar.style.width = `${newWidth}px`;
        });

        document.addEventListener('mouseup', () => {
            if (isResizing) {
                isResizing = false;
                document.body.style.cursor = 'default';
                resizer.classList.remove('active-resize');
                playerFrame.style.pointerEvents = 'auto';
            }
        });

        // --- 3. Lógica de PWA (Instalación y Service Worker) ---
        let promptDiferido;
        const botonInstalar = document.getElementById('installBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            promptDiferido = e;
            botonInstalar.style.display = 'flex';
        });

        botonInstalar.addEventListener('click', async () => {
            if (promptDiferido !== null) {
                promptDiferido.prompt();
                const { outcome } = await promptDiferido.userChoice;
                if (outcome === 'accepted') {
                    console.log('El usuario aceptó la instalación');
                }
                promptDiferido = null;
                botonInstalar.style.display = 'none';
            }
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(registro => {
                    console.log('ServiceWorker registrado con éxito: ', registro.scope);
                }).catch(err => {
                    console.log('Error al registrar ServiceWorker: ', err);
                });
            });
        }
    </script>
</body>
</html>
