<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Player UI</title>
    <!-- Importamos una fuente moderna (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0f172a; /* Azul muy oscuro */
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6; /* Azul brillante */
            --accent-hover: #60a5fa;
            --sidebar-width: 450px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15), transparent 25%),
                              radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15), transparent 25%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 3rem 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 4rem;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.05em;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* --- Grid y Tarjetas --- */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.5);
        }

        /* Contenedor de la Imagen (Soporta GIF y PNG) */
        .card-img-wrapper {
            width: 100%;
            height: 180px;
            position: relative;
            overflow: hidden;
        }

        .card-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ajusta la imagen sin deformarla */
            transition: transform 0.5s ease;
        }

        .card:hover .card-img-wrapper img {
            transform: scale(1.08);
        }

        /* Botón de Play superpuesto */
        .play-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .card:hover .play-overlay {
            opacity: 1;
        }

        .play-btn-icon {
            width: 60px;
            height: 60px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.5);
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }

        .card:hover .play-btn-icon {
            transform: scale(1);
        }

        .play-btn-icon svg {
            width: 24px;
            height: 24px;
            fill: white;
            margin-left: 4px; /* Centrar visualmente el triángulo */
        }

        /* Contenido de la tarjeta */
        .card-content {
            padding: 1.5rem;
            flex-grow: 1;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .card-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        /* --- Panel Lateral (Sidebar) --- */
        .sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: var(--sidebar-width);
            max-width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255,255,255,0.1);
            transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1); /* Animación fluida */
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        .sidebar.active {
            right: 0;
        }

        .sidebar-header {
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .sidebar-header h3 {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .close-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .close-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        #playerFrame {
            width: 100%;
            flex-grow: 1;
            border: none;
            background: transparent;
        }

        /* --- Capa Oscura (Overlay) --- */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
            z-index: 999;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>
<body>

    <header>
        <h1>MyAudio Space</h1>
        <p>Tu colección de pistas, podcasts y sonidos</p>
    </header>

    <!-- Contenedor donde se inyectarán las tarjetas -->
    <div class="card-grid" id="cardContainer"></div>

    <!-- Panel Lateral y Overlay -->
    <div class="overlay" id="overlay"></div>
    
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3>Reproductor Activo</h3>
            <button class="close-btn" id="closeBtn">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M13 1L1 13M1 1L13 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>
        <iframe id="playerFrame" src="" allow="autoplay"></iframe>
    </div>

    <script>
        // --- BASE DE DATOS SIMULADA ---
        // En GitHub Pages, esto equivale a tu archivo JSON. 
        // Puedes agregar URLs de GIFs o PNGs libremente en "imagen".
        const datosAudios = [
            {
                titulo: "Lofi Beats",
                descripcion: "Música relajante con un GIF animado de fondo.",
                imagen: "https://media.giphy.com/media/L0qTl8hl84CQVI0Tlu/giphy.gif", // URL de un GIF
                url: "reproductor_lofi.html" // Tu archivo HTML o enlace
            },
            {
                titulo: "Synthwave Retro",
                descripcion: "Imagen PNG estática de alta calidad.",
                imagen: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop", // URL de un PNG/JPG
                url: "reproductor_synth.html"
            },
            {
                titulo: "Podcast Tech",
                descripcion: "Diseño limpio usando imágenes vectoriales o fotos.",
                imagen: "https://images.unsplash.com/photo-1590602847861-f357a9332bbc?q=80&w=2574&auto=format&fit=crop",
                url: "reproductor_podcast.html"
            },
            {
                titulo: "Naturaleza y Lluvia",
                descripcion: "GIF animado de lluvia para mayor inmersión.",
                imagen: "https://media.giphy.com/media/Il9f7ZhytEiI0/giphy.gif",
                url: "reproductor_nature.html"
            }
        ];

        // --- LÓGICA DE LA INTERFAZ ---
        const cardContainer = document.getElementById('cardContainer');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const closeBtn = document.getElementById('closeBtn');
        const playerFrame = document.getElementById('playerFrame');

        // Generar las tarjetas dinámicamente
        function renderizarTarjetas() {
            datosAudios.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                
                // Estructura HTML de cada tarjeta
                card.innerHTML = `
                    <div class="card-img-wrapper">
                        <img src="${item.imagen}" alt="${item.titulo}">
                        <div class="play-overlay">
                            <div class="play-btn-icon">
                                <!-- Icono SVG de Play -->
                                <svg viewBox="0 0 24 24">
                                    <path d="M8 5v14l11-7z"/>
                                </svg>
                            </div>
                        </div>
                    </div>
                    <div class="card-content">
                        <h2 class="card-title">${item.titulo}</h2>
                        <p class="card-desc">${item.descripcion}</p>
                    </div>
                `;

                // Al hacer clic, abre el reproductor
                card.addEventListener('click', () => openPlayer(item.url));
                cardContainer.appendChild(card);
            });
        }

        // Funciones del panel
        function openPlayer(url) {
            playerFrame.src = url;
            sidebar.classList.add('active');
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden'; // Evita el scroll de fondo
        }

        function closePlayer() {
            sidebar.classList.remove('active');
            overlay.classList.remove('active');
            document.body.style.overflow = ''; // Restaura el scroll
            
            // Retraso para que la animación termine antes de cortar el iframe
            setTimeout(() => { playerFrame.src = ''; }, 400);
        }

        // Eventos de cierre
        closeBtn.addEventListener('click', closePlayer);
        overlay.addEventListener('click', closePlayer);

        // Iniciar la creación de tarjetas
        renderizarTarjetas();
    </script>
</body>
</html>
